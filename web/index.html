<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PropSimulator</title>
<style>
:root{
  --bg:#060a11; --panel:#0b111a; --panel2:#0e1621; --line:#172431; --line2:#1e3040;
  --ink:#c6d5e3; --ink2:#8aa0b5; --dim:#5d7488; --faint:#3d5164;
  --accent:#45c7e0; --accent2:#2b8fa8;
  --good:#54d18b; --warn:#efa14e; --bad:#ef6b74;
  --ocean:#a9e9ec; --land:#f4f8fa;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:12px/1.45 var(--mono);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{
  height:100vh;display:grid;
  grid-template-columns:296px 1fr 300px;
  grid-template-rows:42px 1fr 216px;
  grid-template-areas:"head head head" "side stage read" "side charts charts";
}

/* ---------- header ---------- */
header{
  grid-area:head;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.02em}
.brand .ring{
  width:13px;height:13px;border-radius:50%;border:1.5px solid var(--accent);
  box-shadow:0 0 8px rgba(69,199,224,.5);flex:none;
}
.brand em{font-style:normal;color:var(--accent)}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:3px;
  border:1px solid var(--line2);color:var(--ink2);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap;background:var(--panel2);
}
.chip .dot{width:5px;height:5px;border-radius:50%;background:var(--dim)}
.chip.live .dot{background:var(--good);box-shadow:0 0 6px var(--good)}
.clock{color:var(--dim);font-size:11px;white-space:nowrap}
.clock b{color:var(--ink2);font-weight:400}
.spacer{flex:1}
.presets{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
button.preset{
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);
  font:inherit;font-size:11px;padding:4px 10px;border-radius:3px;cursor:pointer;
  white-space:nowrap;
}
button.preset:hover{border-color:var(--accent2);color:var(--ink)}
button.preset.on{background:rgba(69,199,224,.14);border-color:var(--accent);color:var(--accent)}

/* ---------- sidebar ---------- */
aside{
  grid-area:side;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;
}
aside::-webkit-scrollbar,.readout::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb,.readout::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
section.group{border-bottom:1px solid var(--line)}
section.group>h2{
  margin:0;padding:11px 14px;font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink2);cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;user-select:none;
}
section.group>h2:hover{color:var(--ink)}
section.group>h2 .caret{color:var(--faint);transition:transform .15s}
section.group[data-open="0"] .caret{transform:rotate(-90deg)}
section.group[data-open="0"] .body{display:none}
.body{padding:0 14px 14px}
.ctl{margin-bottom:13px}
.ctl:last-child{margin-bottom:2px}
.ctl .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px}
.ctl label{color:var(--ink2);font-size:11.5px}
.ctl .val{color:var(--accent);font-size:12px;white-space:nowrap}
.ctl .val .u{color:var(--dim);font-size:10.5px;margin-left:3px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
  background:var(--line2);outline:none;margin:0;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:2px solid var(--bg);
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--accent);
  cursor:pointer;border:2px solid var(--bg);
}
input[type=text],input[type=number],select{
  width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--ink);
  font:inherit;font-size:11.5px;padding:5px 7px;border-radius:3px;
}
input:focus,select:focus{outline:1px solid var(--accent2);outline-offset:-1px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
button.tiny{
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);
  font:inherit;font-size:10.5px;padding:3px 8px;border-radius:3px;cursor:pointer;
}
button.tiny:hover{border-color:var(--accent2);color:var(--ink)}
button.tiny.on{background:rgba(69,199,224,.14);border-color:var(--accent);color:var(--accent)}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{
  flex:1;background:transparent;border:0;color:var(--ink2);font:inherit;font-size:11px;
  padding:5px 0;cursor:pointer;
}
.seg button.on{background:rgba(69,199,224,.16);color:var(--accent)}
.hint{color:var(--faint);font-size:10.5px;line-height:1.4;margin:-4px 0 10px}

/* ---------- stage ---------- */
.stage{grid-area:stage;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#0a1420 0%,var(--bg) 70%)}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#globe.drag{cursor:grabbing}
.overlay{
  position:absolute;background:rgba(11,17,26,.9);border:1px solid var(--line);
  border-radius:4px;backdrop-filter:blur(6px);
}
.layers{top:14px;left:14px;padding:11px 13px;width:184px}
.layers h3,.feed h3{
  margin:0 0 9px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);font-weight:600;
}
.layers label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;color:var(--ink2);font-size:11.5px}
.layers input{accent-color:var(--accent);width:12px;height:12px;margin:0}
.layers .sep{height:1px;background:var(--line);margin:9px 0}
.feed{bottom:14px;left:14px;width:246px;padding:11px 13px}
.feed .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:9px 0}
.feed .grid>div{min-width:0}
.feed .k{color:var(--faint);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
         line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .v{color:var(--ink);font-size:12.5px;line-height:1.3}
.feed .v .u{color:var(--dim);font-size:10px}
.feed .feedfoot{color:var(--faint);font-size:10px;line-height:1.5;margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.spark{width:100%;height:34px;display:block;margin-bottom:2px}

/* ---------- readout ---------- */
.readout{
  grid-area:read;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;padding:14px;
}
.status{border:1px solid var(--line2);border-radius:4px;padding:10px 12px;margin-bottom:14px}
.status .label{font-size:13px;font-weight:600;letter-spacing:.06em}
.status .note{color:var(--dim);font-size:10.5px;margin-top:3px}
.status.good{border-color:rgba(84,209,139,.45);background:rgba(84,209,139,.07)}
.status.good .label{color:var(--good)}
.status.warn{border-color:rgba(239,161,78,.45);background:rgba(239,161,78,.07)}
.status.warn .label{color:var(--warn)}
.status.bad{border-color:rgba(239,107,116,.45);background:rgba(239,107,116,.07)}
.status.bad .label{color:var(--bad)}
.rgroup{margin-bottom:15px}
.rgroup h4{
  margin:0 0 7px;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--faint);font-weight:600;
}
.row{display:flex;align-items:center;gap:7px;padding:2.5px 0;font-size:11.5px}
.row .dot{width:5px;height:5px;border-radius:50%;background:var(--faint);flex:none}
.row .dot.good{background:var(--good)}
.row .dot.warn{background:var(--warn)}
.row .dot.bad{background:var(--bad)}
.row .dot.on{background:var(--accent)}
.row .n{color:var(--ink2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{color:var(--ink);white-space:nowrap}
.row .v.good{color:var(--good)} .row .v.warn{color:var(--warn)} .row .v.bad{color:var(--bad)}
.row .v.accent{color:var(--accent)}
.row .v .u{color:var(--dim);font-size:10px;margin-left:3px}

/* ---------- charts ---------- */
.charts{
  grid-area:charts;display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--line);border-top:1px solid var(--line);
}
.chart{background:var(--panel);padding:9px 12px 4px;position:relative;overflow:hidden}
.chart .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.chart .ti{font-size:11px;color:var(--ink2)}
.chart .lg{display:flex;gap:11px;flex-wrap:wrap;font-size:10px;color:var(--dim)}
.chart .lg i{display:inline-block;width:11px;height:2px;vertical-align:middle;margin-right:4px}
.chart svg{width:100%;height:calc(100% - 20px);display:block;overflow:visible}
.chart .busy{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(11,17,26,.72);color:var(--dim);font-size:11px;letter-spacing:.06em;
}
.chart .busy[hidden]{display:none}
.chartfoot{
  position:absolute;bottom:2px;left:12px;right:12px;display:flex;
  justify-content:space-between;color:var(--faint);font-size:9.5px;pointer-events:none;
}
.err{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;
  background:rgba(239,107,116,.14);border:1px solid var(--bad);color:var(--bad);
  padding:8px 14px;border-radius:4px;font-size:11.5px;max-width:70%;
}
</style>
</head>
<body>
<div id="app">

<header>
  <div class="brand"><span class="ring"></span>PropSimulator <em>Live</em></div>
  <span class="chip" id="modeChip"><span class="dot"></span><span id="modeText">manual</span></span>
  <span class="clock">sim <b id="simClock">—</b></span>
  <span class="chip" id="computeChip">— ms</span>
  <div class="spacer"></div>
  <div class="presets" id="presets"></div>
  <button class="preset" id="liveBtn" title="Fetch current conditions from NOAA SWPC">◎ LIVE off</button>
</header>

<aside id="sidebar"></aside>

<div class="stage">
  <canvas id="globe"></canvas>

  <div class="overlay layers">
    <h3>Layers</h3>
    <label><input type="checkbox" data-layer="land" checked> Surface model (land / sea)</label>
    <label><input type="checkbox" data-layer="night" checked> Day/night terminator</label>
    <label><input type="checkbox" data-layer="shells" checked> Ionospheric shells</label>
    <label><input type="checkbox" data-layer="coverage" checked> Coverage &amp; markers</label>
    <label><input type="checkbox" data-layer="fan" checked> Secondary rays</label>
    <div class="sep"></div>
    <button class="tiny" id="framePath" style="width:100%;padding:5px">Frame path</button>
  </div>

  <div class="overlay feed">
    <h3 id="feedTitle">Manual mode · feed unavailable</h3>
    <svg class="spark" id="spark" viewBox="0 0 220 34" preserveAspectRatio="none"></svg>
    <div class="grid" id="feedGrid"></div>
    <div class="feedfoot" id="feedFoot">Drag to rotate · scroll to zoom</div>
  </div>
</div>

<div class="readout" id="readout"></div>

<div class="charts">
  <div class="chart">
    <div class="hd">
      <span class="ti">Field strength and SNR vs distance</span>
      <span class="lg">
        <span><i style="background:#45c7e0"></i>E [dBµV/m]</span>
        <span><i style="background:#54d18b"></i>SNR [dB]</span>
        <span><i style="background:#efa14e"></i>required</span>
      </span>
    </div>
    <svg id="chartCoverage"></svg>
    <div class="busy" id="busyCoverage" hidden>computing coverage…</div>
  </div>
  <div class="chart">
    <div class="hd">
      <span class="ti">MUF and LOF vs distance</span>
      <span class="lg">
        <span><i style="background:#45c7e0"></i>MUF [MHz]</span>
        <span><i style="background:#efa14e"></i>LOF [MHz]</span>
        <span><i style="background:#54d18b"></i>usable band</span>
      </span>
    </div>
    <svg id="chartBand"></svg>
    <div class="busy" id="busyBand" hidden>solving usable band…</div>
  </div>
</div>

</div>
<script src="/static/app.js"></script>
</body>
</html>
